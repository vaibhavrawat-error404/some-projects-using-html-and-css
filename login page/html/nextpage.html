<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeeksforGeeks</title>
    <link rel="stylesheet" href="/login page/css/ai.css">
</head>
<body>
    <main>
        <article id="login">
            <form action="/login" method="post">
                <!-- If you are using an image instead of text for the logo -->
                <img src="assets/image.png" alt="GeeksforGeeks Logo" id="imgofpage">

                <h3>Enter your login credentials</h3>

                <div class="input-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter your Username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                </div>

                <button type="submit">Submit</button>

                <p class="signup-text">
                    Not registered? <a href="nextpage.html">Create an account</a>
                </p>
            </form>
        </article>
    </main>
</body>
</html>
